name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  # composer.lock is not committed, so a new upstream release can break the
  # matrix; this shows it on main before the next pull request runs into it.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      # The lowest lane tests the oldest Laravel 13 release composer.json
      # allows, which Composer would otherwise skip for its security advisories.
      - name: Allow releases with security advisories
        if: matrix.stability == 'prefer-lowest'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      # The code is the same on every OS, but Larastan types console
      # arguments from the command signature only on Windows, so its verdict
      # there differs from the one everyone gets locally.
      - name: PHPStan
        if: runner.os != 'Windows'
        run: composer analyse

      - name: Linter
        run: composer lint:check

      # Only where Pest 5 resolves, which needs PHP 8.4: the type coverage plugin
      # before 5.0.1 writes its cache from parallel workers and corrupts it at
      # random, and PHP 8.3 only gets Pest 4 with that plugin. The result does not
      # depend on the lane anyway.
      - name: Type Coverage
        if: runner.os != 'Windows' && matrix.stability == 'prefer-stable' && matrix.php != '8.3'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

  # Docs, agent skills and repository settings cannot change what a database
  # does, so a change that touches only those skips the database lanes. The
  # first push of a branch has no base to compare and always runs them.
  changes:
    runs-on: ubuntu-latest

    outputs:
      databases: ${{ steps.diff.outputs.databases }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "databases=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only "$BASE" HEAD | grep -vE '\.md$|^docs/|^resources/boost/|^\.(agents|claude|codex|cursor|junie)/|^\.github/(assets|ISSUE_TEMPLATE)/|^\.github/(dependabot|release)\.yml$')" ]; then
            echo "databases=true" >> "$GITHUB_OUTPUT"
          else
            echo "databases=false" >> "$GITHUB_OUTPUT"
          fi

  databases:
    needs: changes
    if: needs.changes.outputs.databases == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The versions of these engines that Laravel's own databases workflow
        # covers. The Postgres image keeps its data elsewhere from 18 on, and
        # refuses to start with a mount at the old path.
        include:
          - db: mysql
            image: mysql:5.7
          - db: mysql
            image: mysql:8.4
          - db: mysql
            image: mysql:9.7
          - db: mariadb
            image: mariadb:10.11
          - db: mariadb
            image: mariadb:11.8
          - db: mariadb
            image: mariadb:12.3
          - db: pgsql
            image: postgres:10
            pgdata: /var/lib/postgresql/data
          - db: pgsql
            image: postgres:14
            pgdata: /var/lib/postgresql/data
          - db: pgsql
            image: postgres:18
            pgdata: /var/lib/postgresql

    name: ${{ matrix.image }}

    # An empty image skips a service, so each lane starts only its database.
    # Data lives on tmpfs: every test commits rows and the suite deletes them
    # again, and each commit would otherwise wait for the runner's disk.
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && matrix.image || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: waitlist
        ports: ['3306:3306']
        options: --tmpfs /var/lib/mysql --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: ${{ matrix.db == 'mariadb' && matrix.image || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: waitlist
        ports: ['3306:3306']
        options: --tmpfs /var/lib/mysql --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: ${{ matrix.db == 'pgsql' && matrix.image || '' }}
        env:
          POSTGRES_DB: waitlist
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --tmpfs ${{ matrix.pgdata }} --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo_mysql, pdo_pgsql, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      # Not parallel: the processes would share one database. The concurrency
      # tests only run here, against two real connections.
      - name: Test Suite
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}
